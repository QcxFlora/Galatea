name: galatea_studio
description: "Galatea Studio —— 思维导图式 Galgame 引擎的可视化编辑器与播放器"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  file_picker: ^8.1.6
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - assets/characters/