<?xml version="1.0" encoding="UTF-8"?>
<!--
  Galatea 图标 · 矢量 · 瑞士国际主义风格
  ───────────────────────────────────────
  构成：一个根节点向右、下分出三路
    · 实心白方块（左）  = 已完成的剧情节点
    · 实心红方块（右）  = 脚本节点（全项目唯一彩色）
    · 虚线 + 空心方块（下）= 尚未完成的支线
    · 外圈 1px 轨道      = 来自星尘的星图感
  栅格：192 × 192，所有坐标落在 8 的倍数上
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" fill="#0A0A0A"/>

  <!-- 星图轨道 -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="96" cy="96" r="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

  <!-- 连线：根 → 左 / 右 / 下 -->
  <path d="M96 64 V96 M96 96 H64 M96 96 H128"
        fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M96 96 V136"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"
        stroke-dasharray="6 6"/>

  <!-- 节点 -->
  <rect x="88" y="48" width="16" height="16" fill="#FFFFFF"/>
  <rect x="56" y="88" width="16" height="16" fill="#FFFFFF"/>
  <rect x="120" y="88" width="16" height="16" fill="#E4032E"/>
  <rect x="88" y="136" width="16" height="16" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
</svg>