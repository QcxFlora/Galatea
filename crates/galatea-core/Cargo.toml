[package]
name = "galatea-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Galatea 引擎核心：思维导图式剧情图的解析、校验与解释执行（零外部依赖）"

[lib]
name = "galatea_core"
path = "src/lib.rs"

[[bin]]
name = "galatea"
path = "src/bin/galatea.rs"

[dependencies]
flate2 = { version = "1.1.11", features = ["rust_backend"] }
