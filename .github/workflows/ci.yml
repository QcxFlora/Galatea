name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust 核心
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 测试
        run: cargo test --workspace
      - name: 发布构建
        run: cargo build --release --workspace
      - name: 示例剧本体检（有错误则失败）
        run: |
          cargo run -q -p galatea-core --bin galatea -- lint samples/rain.json
          cargo run -q -p galatea-core --bin galatea -- fmt samples/rain.json
          git diff --exit-code samples/rain.json

  flutter:
    name: Flutter 端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test