name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust 核心
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 测试
        run: cargo test --workspace
      - name: 发布构建
        run: cargo build --release --workspace
      - name: 示例剧本体检（有错误则失败）
        run: |
          cargo run -q -p galatea-core --bin galatea -- lint samples/rain.json
          cargo run -q -p galatea-core --bin galatea -- fmt samples/rain.json
          git diff --exit-code samples/rain.json

  web:
    name: Web 先行版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: |
          python3 - <<'EOF'
          import re
          html = open('web/index.html', encoding='utf-8').read()
          m = re.search(r'<script>([\s\S]*)</script>', html)
          open('/tmp/galatea.js', 'w', encoding='utf-8').write(m.group(1))
          EOF
          node --check /tmp/galatea.js
      - name: 核心逻辑测试（表达式 / VM / lint）
        run: node web/test_logic.js

  flutter:
    name: Flutter 端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  rules:
    name: 代码纪律（RULES.md）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 禁止静默降级 / 空捕获 / 占位
        run: |
          fail=0
          check() {
            if grep -rnE "$1" $2 --include="$3" 2>/dev/null; then
              echo "::error::违反 RULES.md 第 $4 条：$5"
              fail=1
            fi
          }
          check 'catch\s*\(\s*_\s*\)\s*\{\s*\}' app/lib dart "2" "空捕获 catch (_) {}"
          check 'errorBuilder' app/lib dart "1" "errorBuilder 吞掉图片错误"
          check '\?\? const SizedBox' app/lib dart "1" "?? const SizedBox 占位"
          check 'catch\s*\(\s*_\s*\)\s*\{\s*continue' app/lib dart "2" "catch (_) { continue }"
          if [ $fail -ne 0 ]; then
            echo "修复方式见 RULES.md：要么能跑，要么明确地坏，不许偷偷降级。"
            exit 1
          fi
          echo "✅ 没有发现静默降级 / 空捕获"
