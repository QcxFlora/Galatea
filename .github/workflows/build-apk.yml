name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 自动版本号
        run: |
          BASE=$(cat VERSION)                              # 0.2.0（三段基线）
          VER="${BASE}.${GITHUB_RUN_NUMBER}"               # 0.2.0.57（给人看 / 文件名 / tag）
          echo "VER=$VER" >> "$GITHUB_ENV"
          # Cargo 与 Flutter 都只认三段 semver，构建号只能挂在后缀上：
          sed -i "s/^version = \".*\"$/version = \"${BASE}-build.${GITHUB_RUN_NUMBER}\"/" Cargo.toml
          sed -i "s/^version: .*/version: ${BASE}+${GITHUB_RUN_NUMBER}/" app/pubspec.yaml
          echo "── 显示版本：$VER"
          grep -m1 '^version' Cargo.toml
          grep -m1 '^version:' app/pubspec.yaml

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 编译 3D 原生库（arm64）
        run: |
          curl -sSL https://github.com/bbqsrc/cargo-ndk/releases/latest/download/cargo-ndk-linux.zip -o /tmp/cargo-ndk.zip
          unzip -qo /tmp/cargo-ndk.zip -d "$HOME/.cargo/bin" || cargo install cargo-ndk --quiet
          chmod +x "$HOME/.cargo/bin/cargo-ndk" || true
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo ndk -t arm64-v8a -o out/jniLibs build --release -p galatea-3d
          ls -lh out/jniLibs/arm64-v8a/ || true

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 生成 Android 平台目录
        working-directory: app
        run: |
          flutter create --platforms=android \
            --project-name galatea_studio \
            --org dev.galatea \
            --description "Galatea Studio - 思维导图式 Galgame 引擎" \
            .
          # 允许明文 HTTP（本地资源）并确认签名配置走 debug key（可直接安装）
          ls android/app/src/main/AndroidManifest.xml

      - name: Android 工程改造（包名 / 固定签名 / 应用名）
        run: python3 scripts/android_setup.py app

      - name: 放入 3D 原生库
        run: |
          set -e
          if [ -d out/jniLibs/arm64-v8a ]; then
            mkdir -p app/android/app/src/main/jniLibs
            cp -rv out/jniLibs/arm64-v8a app/android/app/src/main/jniLibs/
          else
            echo "::warning::没有编出 libgalatea_3d.so，3D 预览会显示占位"
          fi

      - name: 应用图标
        working-directory: app
        run: |
          set -e
          # 尺寸映射
          for d in android/app/src/main/res/mipmap-*; do
            [ -d "$d" ] || continue
            case "$d" in
              *mdpi*)   s=48 ;;
              *hdpi*)   s=72 ;;
              *xhdpi*)  s=96 ;;
              *xxhdpi*) s=144 ;;
              *)        s=192 ;;
            esac
            cp "icon/ic_launcher_$s.png" "$d/ic_launcher.png"
          done
          # 去掉 adaptive icon 的 xml（否则系统优先用它，png 不生效）
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          ls -l android/app/src/main/res/mipmap-xxxhdpi/ | head -4

      - name: 构建 release APK
        working-directory: app
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm64 --dart-define=APP_VERSION=${{ env.VER }}

      - name: 收集产物
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk "out/galatea-${VER}.apk"
          cp "out/galatea-${VER}.apk" out/galatea-latest.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: galatea-apk-${{ env.VER }}
          path: out/galatea-*.apk
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Galatea ${{ env.VER }}
          body: |
            ## Galatea 0.1.0 先行版

            思维导图式 Galgame 引擎的 Android 客户端（与 Web 先行版同源）。

            **安装**：下载 `galatea-latest.apk`（最新）或 `galatea-${{ env.VER }}.apk`（此版本），
            允许「安装未知来源应用」后安装。
            首次启动进入首界面 → 「试玩示例」直接体验，或「新建剧本」开始画剧情图。

            **功能**：思维导图编辑器（拖拽 / 连线 / 属性面板 / 实时体检 / 自动布局）、
            播放器（打字机 / 变量插值 / 撤销 / 存读档 / 回想 / 自动模式）、
            lilt 弹簧动画、扁平 3D 首界面。

            引擎核心与 Web 版同一份 JSON 格式，剧本可在任意端打开。
          files: |
            out/galatea-${{ env.VER }}.apk
            out/galatea-latest.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}